[package]
# on crates.io as "isnady": cargo install isnady gives iy-rs (as pip install isnady gives iy)
name = "isnady"
description = "isnady in Rust: hadith search over isnad chains and narrators — the same data, rules and version as the Python isnady"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["hadith", "isnad", "arabic", "search", "islam"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "iy-rs"
path = "src/main.rs"

[dependencies]
isnady-core.workspace = true
clap.workspace = true
