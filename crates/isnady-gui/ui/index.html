<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>isnady</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- the menu bar: File, Edit, View, Tools, Help (frame.js) -->
  <div id="menubar" role="menubar"></div>

  <div id="frame">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-latin">isnady</div>
      <div class="brand-arabic" lang="ar">إسناد</div>
    </div>
    <div class="history"><button id="back" class="side-button">◀</button><button id="forward" class="side-button">▶</button></div>
    <nav id="nav"></nav>
    <div class="langs">
      <button id="ui-lang" class="side-button"></button>
      <button id="content-lang" class="side-button"></button>
    </div>
    <div id="footer"></div>
  </aside>

  <main id="main">
    <!-- Search -->
    <section id="page-search" class="page search-page"></section>

    <!-- Isnad Chains -->
    <section id="page-chains" class="page" hidden></section>

    <!-- Books -->
    <section id="page-books" class="page" hidden></section>

    <!-- Narrators -->
    <section id="page-narrators" class="page narrators-page" hidden></section>

    <!-- Hadith Scholars -->
    <section id="page-scholars" class="page" hidden></section>

    <!-- Companions and the Household -->
    <section id="page-companions" class="page" hidden></section>

    <!-- Sira -->
    <section id="page-sira" class="page" hidden></section>

    <!-- Written sources -->
    <section id="page-sahifa" class="page" hidden></section>

    <!-- Statistics -->
    <section id="page-statistics" class="page" hidden></section>

    <!-- Genealogies -->
    <section id="page-genealogy" class="page" hidden></section>

    <!-- Learn and Bookmarks -->
    <section id="page-learn" class="page" hidden></section>
    <section id="page-bookmarks" class="page" hidden></section>

    <!-- a section not ported yet -->
    <section id="page-later" class="page" hidden>
      <div class="later">
        <h1 id="later-title"></h1>
        <p id="later-text"></p>
      </div>
    </section>
  </main>
  </div>

  <script src="app.js"></script>
  <script src="frame.js"></script>
  <script src="search.js"></script>
  <script src="narrators.js"></script>
  <script src="hadithnav.js"></script>
  <script src="chains.js"></script>
  <script src="books.js"></script>
  <script src="quran.js"></script>
  <script src="scholars.js"></script>
  <script src="companions.js"></script>
  <script src="sira.js"></script>
  <script src="sahifa.js"></script>
  <script src="stats.js"></script>
  <script src="genealogy.js"></script>
  <script src="learn.js"></script>
  <script src="bookmarks.js"></script>
  <script src="prefs.js"></script>
  <script src="logview.js"></script>
</body>
</html>
