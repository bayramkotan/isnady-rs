<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>isnady</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- the menu bar: File, Edit, View, Tools, Help (frame.js) -->
  <div id="menubar" role="menubar"></div>

  <div id="frame">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-latin">isnady</div>
      <div class="brand-arabic" lang="ar">إسناد</div>
    </div>
    <div class="history"><button id="back" class="side-button">◀</button><button id="forward" class="side-button">▶</button></div>
    <nav id="nav"></nav>
    <div class="langs">
      <button id="ui-lang" class="side-button"></button>
      <button id="content-lang" class="side-button"></button>
    </div>
    <div id="footer"></div>
  </aside>

  <main id="main">
    <!-- Search -->
    <section id="page-search" class="page search-page"></section>

    <!-- Isnad Chains -->
    <section id="page-chains" class="page" hidden>
      <div class="bar">
        <label class="field"><span id="book-label"></span> <select id="chain-book"></select></label>
        <label class="field"><span id="number-label"></span> <input id="chain-number" type="text" size="9" autocomplete="off"></label>
        <button id="show-chain" class="primary"></button>
        <button id="random" class="quiet"></button>
        <span class="grow"></span>
        <button id="prev" class="quiet"></button>
        <button id="next" class="quiet"></button>
      </div>
      <div id="chain-view"></div>
    </section>

    <!-- Books -->
    <section id="page-books" class="page wide" hidden>
      <div class="books">
        <aside class="shelf">
          <div class="roads" id="roads"></div>
          <div id="shelf"></div>
        </aside>
        <div class="reader" id="reader"></div>
      </div>
    </section>

    <!-- Narrators -->
    <section id="page-narrators" class="page wide" hidden>
      <div class="books">
        <aside class="shelf">
          <div class="roads" id="n-roads"></div>
          <input id="nq" type="search" autocomplete="off" spellcheck="false">
          <div id="n-list"></div>
        </aside>
        <div class="reader" id="n-view"></div>
      </div>
    </section>

    <!-- a section not ported yet -->
    <section id="page-later" class="page" hidden>
      <div class="later">
        <h1 id="later-title"></h1>
        <p id="later-text"></p>
      </div>
    </section>
  </main>
  </div>

  <script src="app.js"></script>
  <script src="frame.js"></script>
  <script src="search.js"></script>
</body>
</html>
