[workspace]
resolver = "2"
members = ["crates/isnady-core", "crates/isnady-cli", "crates/isnady-gui"]

# One version for the whole workspace, always the same number as the Python isnady (Bayram, 2026-11-03:
# "sürüm numaraları birebir aynı olsun"). tools/bump_version.py writes it.
[workspace.package]
version = "0.7.8"
edition = "2021"
license = "MIT"
authors = ["Bayram Kotan"]
repository = "https://github.com/bayramkotan/isnady-rs"
homepage = "https://github.com/bayramkotan/isnady"
rust-version = "1.75"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
fancy-regex = "0.14"
unicode-normalization = "0.1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md5 = "0.7"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
url = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rpassword = "=7.3.1"
# the PDF writer (A5): Arabic shaped, the text in visual order, the streams compressed
rustybuzz = "0.20"
unicode-bidi = "0.3"
flate2 = "1"
# the core, with the same version as the workspace (tools/bump_version.py writes both): crates.io needs the version
isnady-core = { path = "crates/isnady-core", version = "=0.7.8" }

[profile.release]
lto = true
codegen-units = 1
strip = true
