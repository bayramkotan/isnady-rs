name: crates.io

# isnady-core and isnady (iy-rs) on crates.io: cargo install isnady. Called by the Release workflow for every tag,
# or by hand (gh workflow run publish.yml). A version already on crates.io is left as it is. Needs the repository
# secret CARGO_REGISTRY_TOKEN (crates.io → Account Settings → API Tokens, scopes publish-new and publish-update).
on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish what is not there yet
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for crate in isnady-core isnady; do
            if curl -sf -A "isnady-rs release (github.com/bayramkotan/isnady-rs)" \
                 "https://crates.io/api/v1/crates/${crate}/${version}" > /dev/null; then
              echo "${crate} ${version} is already on crates.io"
              continue
            fi
            cargo publish --locked -p "${crate}"
            # the next crate needs this one in the index
            for i in $(seq 1 30); do
              curl -sf -A "isnady-rs release (github.com/bayramkotan/isnady-rs)" \
                "https://crates.io/api/v1/crates/${crate}/${version}" > /dev/null && break
              sleep 10
            done
          done
