name: Parity

# The Rust iy-rs and the Python iy on the same data: a few books imported from isnady-data by the Python isnady of the
# same version (its tag, or main), then tools/parity.py compares what both print, word for word. The word lists and
# patterns isnady-rs reads (crates/isnady-core/data/*.json) are checked against that isnady too, and the chains and
# narrators both read from the texts must be the same rows in the database (tools/parity_db.py), and so must a few books
# imported by each into an empty folder of its own.
on:
  workflow_call:
    inputs:
      isnady:
        description: the Python isnady to compare with (a tag such as v0.7.4, or main)
        required: true
        type: string

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      ISNADY_DATA_DIR: ${{ github.workspace }}/parity-data
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The libraries Qt needs to write a PDF (the Python isnady's export)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: The Python isnady of the same version
        run: python -m pip install "isnady[ai] @ git+https://github.com/bayramkotan/isnady@${{ inputs.isnady }}"
      - name: Qt starts
        run: python -c "from PySide6 import QtCore, QtGui; print('Qt', QtCore.qVersion())"
      - name: A few books, imported by the Python isnady
        run: |
          iy catalog import al_arbain_al_nawawiyya --language ara --language eng --language tur
          iy catalog import riyad_al_salihin_al_nawawi
          iy catalog import al_shamail_al_muhammadiyya_al_tirmidhi
          iy catalog import sifat_al_shia_al_shaykh_al_saduq
          iy catalog import taqrib_al_tahdhib_ibn_hajar_al_asqalani
          iy catalog import rijal_al_najashi_ahmad_ibn_ali_al_najashi
          iy catalog import al_fihrist_muhammad_ibn_al_hasan_al_tusi
          iy catalog import rijal_al_tusi_muhammad_ibn_al_hasan_al_tusi
          iy search النيات > /dev/null
          iy chain nawawi 1 > /dev/null
          iy book > /dev/null
      - name: The tables are the Python isnady's
        run: python tools/gen_tables.py --check
      - name: Build iy-rs
        run: cargo build --release --locked -p isnady
      - name: Compare
        run: python tools/parity.py --python iy --rust target/release/iy-rs
      - name: The same files exported, the same brought in
        run: python tools/parity_export.py --python iy --rust target/release/iy-rs
      - name: The same ready database downloaded and used
        run: python tools/parity_ready.py --python iy --rust target/release/iy-rs
      - name: The same meaning index and takhrij
        run: python tools/parity_ai.py --python iy --rust target/release/iy-rs
      - name: The same chains and narrators in the database
        run: python tools/parity_db.py --python iy --rust target/release/iy-rs
      - name: The same books imported by both
        run: >
          python tools/parity_db.py --python iy --rust target/release/iy-rs
          --import al_arbain_al_nawawiyya --import al_shamail_al_muhammadiyya_al_tirmidhi
          --import sahifat_hammam_ibn_munabbih
          --import taqrib_al_tahdhib_ibn_hajar_al_asqalani --import rijal_al_najashi_ahmad_ibn_ali_al_najashi
          --import al_fihrist_muhammad_ibn_al_hasan_al_tusi --import rijal_al_tusi_muhammad_ibn_al_hasan_al_tusi
          --import tadhkirat_al_huffaz_al_dhahabi --import al_quran_al_karim
          --import hadith-json/nawawi-hj --import thaqalayn/zuhd
